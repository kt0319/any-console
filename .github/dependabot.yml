version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
