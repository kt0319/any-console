name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please が実タグをリリースした時のみ、GitHub Releases 用のビルド済み
  # バイナリ tarball（4ターゲット）を作成してアップロードする。クロスコンパイル
  # ではなく各OS/archネイティブランナーで並列ビルドする（cross/dockerが不要）。
  build-release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # macos-13（旧Intelランナー）は廃止によりジョブが永遠にqueuedのまま
          # 開始されない。Intel macビルドは後継のmacos-15-intelを使う。
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}

      # embed-assets: npm run build 済みの dist/ と agent_manifests/ をバイナリへ
      # 焼き込む（include_dir! はコンパイル時にディレクトリ実在を要求するため、
      # 必ず npm run build の後に実行する）。
      - name: Build server (release, embed-assets)
        working-directory: server
        run: cargo build --release --features embed-assets --target ${{ matrix.target }}

      # ビルドしたバイナリ単体が最低限起動できることの確認（--versionは
      # サーバ本体を一切起動せず即終了するため、クロスターゲットでも
      # 実行できるネイティブランナー限定で軽量に検証できる）。
      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          out="$(server/target/${{ matrix.target }}/release/any-console-server --version)"
          echo "$out"
          [[ "$out" == any-console-server* ]] || { echo "unexpected --version output: $out" >&2; exit 1; }

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.tag_name || 'dev' }}"
          stage="any-console-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "server/target/${{ matrix.target }}/release/any-console-server" "$stage/"
          cp any-console "$stage/"
          cp -R agent_manifests "$stage/"
          cp -R scripts "$stage/"
          echo "$version" > "$stage/VERSION"
          tar czf "${stage}.tar.gz" "$stage"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          echo "ASSET_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET_PATH" "$CHECKSUM_PATH" --clobber

      - name: Upload workflow artifact (manual dispatch verification)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: any-console-${{ matrix.target }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
