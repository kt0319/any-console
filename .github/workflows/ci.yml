name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一ブランチへの連続 push では古い実行をキャンセルする（main は完走させる）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: ruff check api/

      - name: Type check
        run: mypy api/

      - name: Test
        run: pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml
        env:
          ANY_CONSOLE_TOKEN: test-token
          PYTHONPATH: .

      - name: Backend coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            echo ""
            echo '```'
            python -m coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend test
        run: npm run test:coverage

      - name: Frontend coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Frontend coverage"
              echo ""
              node -e "
                const s = require('./coverage/coverage-summary.json').total;
                console.log('| Metric | Coverage |');
                console.log('| --- | --- |');
                for (const k of ['lines','statements','functions','branches']) {
                  console.log(\`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`);
                }
              "
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f coverage/lcov.info ]; then
            {
              echo "## Frontend coverage"
              echo ""
              echo '```'
              awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END { if (lf>0) printf "lines: %.1f%% (%d/%d)\n", lh/lf*100, lh, lf }' coverage/lcov.info
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    # 通常のブランチ push は smoke（認証・ターミナル・モバイル主要フロー）のみ。
    # main への push・PR・手動実行（workflow_dispatch）は全スペック（full）を実行する。
    env:
      E2E_SUITE: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Start server
        # E2E は短時間に多数のリクエストを送るため、レート制限(既定 200req/60s)を引き上げる
        env:
          ANY_CONSOLE_RATE_LIMIT: "2000"
        run: |
          mkdir -p data
          echo '{"token": "e2e-ci-token"}' > data/auth.json
          nohup python -m api.main > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8888/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"
          cat server.log
          exit 1

      - name: E2E (${{ env.E2E_SUITE }})
        run: |
          if [ "$E2E_SUITE" = "full" ]; then
            npm run test:e2e
          else
            npm run test:e2e:smoke
          fi
        env:
          ANY_CONSOLE_URL: http://localhost:8888
          ANY_CONSOLE_TOKEN: e2e-ci-token

      - name: Server log
        if: failure()
        run: cat server.log

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
