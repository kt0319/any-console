name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: ruff check api/

      - name: Type check
        run: mypy api/

      - name: Test
        run: pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml
        env:
          ANY_CONSOLE_TOKEN: test-token
          PYTHONPATH: .

      - name: Backend coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            echo ""
            echo '```'
            python -m coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend test
        run: npm run test:coverage

      - name: Frontend coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Frontend coverage"
              echo ""
              node -e "
                const s = require('./coverage/coverage-summary.json').total;
                console.log('| Metric | Coverage |');
                console.log('| --- | --- |');
                for (const k of ['lines','statements','functions','branches']) {
                  console.log(\`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`);
                }
              "
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f coverage/lcov.info ]; then
            {
              echo "## Frontend coverage"
              echo ""
              echo '```'
              awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END { if (lf>0) printf "lines: %.1f%% (%d/%d)\n", lh/lf*100, lh, lf }' coverage/lcov.info
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
