name: CI
# NOTE: dispatch-on-ci-failure.yml はこの name を workflow_run.workflows で参照している。
# 変更する場合は dispatch-on-ci-failure.yml 側も合わせて更新すること。

# PR ブランチへの push は pull_request の 1 回だけ実行する（push は main のみ）。
# PR を開く前のブランチ push では CI は走らない。ドキュメントのみの変更もスキップする。
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

# 同一 PR への連続 push では古い実行をキャンセルする（main は完走させる）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend test
        run: npm run test:coverage

      - name: Frontend coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Frontend coverage"
              echo ""
              node -e "
                const s = require('./coverage/coverage-summary.json').total;
                console.log('| Metric | Coverage |');
                console.log('| --- | --- |');
                for (const k of ['lines','statements','functions','branches']) {
                  console.log(\`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`);
                }
              "
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f coverage/lcov.info ]; then
            {
              echo "## Frontend coverage"
              echo ""
              echo '```'
              awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END { if (lf>0) printf "lines: %.1f%% (%d/%d)\n", lh/lf*100, lh, lf }' coverage/lcov.info
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format check
        working-directory: server
        run: cargo fmt --check

      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: server
        run: cargo test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server (release)
        working-directory: server
        run: cargo build --release

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install tmux
        run: sudo apt-get install -y tmux

      # サーバは playwright.config.js の webServer が使い捨て data ディレクトリ付きで
      # 自動起動する（ANY_CONSOLE_URL 未指定 = 使い捨てサーバモード）。
      # サーバログは webServer の stdout/stderr として Playwright の出力に流れる。
      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
