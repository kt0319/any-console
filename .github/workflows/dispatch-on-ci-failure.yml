name: Dispatch on CI failure

# CI（ci.yml の name: と一致させること）が失敗した時、any-console の
# POST /dispatch/recipes/ci-fix（dispatch recipe, ADR 34）へブランチと run の URL だけを送る。
# プロンプト・job・worktree は any-console 側の recipe 定義で固定される。
# recipe が approve: manual ならキューに積まれ、ワークスペース詳細の Dispatch タブから
# 人間が承認するまで実行されない（approve: auto の recipe は即時実行され push 通知が飛ぶ）。
#
# マージ後にユーザーが手動で行う必要がある設定:
#   - Tailscale ACL で tag:ci をこの any-console ホストの該当ポートだけに絞る
#   - Tailscale OAuth クライアントを発行し、Secrets に TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET を登録
#   - any-console の Settings > Auth > API Tokens で scope=dispatch のトークンを発行し、
#     Secrets に ANY_CONSOLE_DISPATCH_TOKEN として登録（メイントークンは絶対に使わないこと）。
#     発行時のボディに "allowed_recipes": ["ci-fix"] を指定する（POST /api-tokens。
#     allowed_recipes に含まれる recipe しか呼べない）
#   - any-console の config の global セクション dispatch_recipes に id: ci-fix の recipe を登録
#     （設定例は README の Dispatch recipes 節）
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    # fork 由来の PR で CI が失敗しても発火させない（このリポジトリは public なため必須）。
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run ci-fix recipe on any-console
        env:
          # head_branch は fork 攻撃者が制御できる値なので、run: に ${{ }} で直書きせず
          # env 経由で渡し、jq --arg で JSON 化する（シェルインジェクション対策）。
          # サーバ側でも recipe の params パターンで再検証される。
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ANY_CONSOLE_DISPATCH_TOKEN: ${{ secrets.ANY_CONSOLE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg branch "$HEAD_BRANCH" \
            --arg url "$RUN_URL" \
            '{branch: $branch, url: $url}')

          curl --fail --show-error --silent \
            -X POST "https://mini.tail794a9.ts.net/dispatch/recipes/ci-fix" \
            -H "Authorization: Bearer ${ANY_CONSOLE_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"
