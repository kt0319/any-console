name: Dispatch on CI failure

# CI（ci.yml の name: と一致させること）が失敗した時、any-console の /dispatch へ direct
# （承認キューを通さない即時実行）でエージェントを起動する。起動するのは、失敗した
# ブランチの worktree（無ければ any-console が作る。既存ブランチのみ）で動く CI 修復用ジョブ。
# 実行できる範囲は direct トークンの制限（ワークスペース・回数・有効期限）と、エージェント自身の
# 権限確認で決まる。main の失敗は対象外（main は worktree にできないため）。
#
# マージ後にユーザーが手動で行う必要がある設定:
#   - Tailscale ACL で tag:ci をこの any-console ホストの該当ポートだけに絞る
#   - Tailscale OAuth クライアントを発行し、Secrets に TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET を登録
#   - any-console の Settings > Auth > API Tokens で scope=direct のトークンを発行する
#     （allowed_workspaces は any-console のみ、max_per_day は小さく、expires_at を付ける）。
#     Secrets に ANY_CONSOLE_DIRECT_TOKEN として登録（メイントークンは絶対に使わないこと）
#   - any-console の any-console ワークスペースに、コマンドが `claude` のジョブを用意し、
#     そのジョブのキー（job_xxxx）を下の AGENT_JOB に合わせる
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    # fork 由来の PR で CI が失敗しても発火させない（このリポジトリは public なため必須）。
    # main は worktree として扱えない（メインの作業ツリーで使用中）ため対象外。
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Start the agent on any-console
        env:
          # head_branch は collaborator が制御できる値なので、run: に ${{ }} で直書きせず
          # env 経由で渡し、jq --arg で JSON 化する（シェルインジェクション対策）。
          # ブランチ名はエージェントへの指示文（text）には入れず、worktree 欄にだけ渡す
          # （direct は承認なしで動くため、指示文への文字列混入を避ける）。
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKSPACE: any-console
          AGENT_JOB: job_6ca0640b0ea2
          ANY_CONSOLE_DIRECT_TOKEN: ${{ secrets.ANY_CONSOLE_DIRECT_TOKEN }}
        run: |
          set -euo pipefail

          text="CI failed. Run: ${RUN_URL}. First run \`gh run view ${RUN_ID} --log-failed\` to inspect the failure log before fixing."

          payload=$(jq -n \
            --arg workspace "$WORKSPACE" \
            --arg worktree "$HEAD_BRANCH" \
            --arg job "$AGENT_JOB" \
            --arg text "$text" \
            '{workspace: $workspace, worktree: $worktree, job: $job, text: $text, direct: true}')

          # direct は dedup_key を受け付けない（同じブランチで失敗が続くと、そのたびに起動する。
          # 回数はトークンの max_per_day で制限される）。
          curl --fail --show-error --silent \
            -X POST "https://mini.tail794a9.ts.net/dispatch" \
            -H "Authorization: Bearer ${ANY_CONSOLE_DIRECT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"
