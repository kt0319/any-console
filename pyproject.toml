[tool.ruff]
target-version = "py311"
line-length = 120
include = ["api/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "C90"]
ignore = [
    "B008",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E402", "S104"]
"api/common.py" = ["S108"]
"api/routers/terminal.py" = ["S606", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["api"]
branch = true
omit = [
    "api/__init__.py",
    # Terminal subsystem: WebSocket fanout, pty.fork, async stream relay.
    # Behaviour depends on OS pty + tmux running processes; deterministic
    # unit coverage is impractical. Smoke-tested manually + integration.
    "api/main.py",
    "api/routers/terminal.py",
    "api/terminal_session.py",
    "api/terminal_pty.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
